services:
  - type: web
    name: ai-data-assistant
    runtime: node
    plan: free
    # 构建需要 vite / vue 这些 devDependencies，Render 若按 production 装包会漏掉，显式带上 --include=dev
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # 不填也能跑（走内置 Mock 引擎）；要接真实模型就在这里填
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
